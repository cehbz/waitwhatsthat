{{- $photoSwipe := resources.Get "photoswipe/photoswipe.umd.min.js" | minify | fingerprint -}}
{{- $photoSwipeLightbox := resources.Get "photoswipe/photoswipe-lightbox.umd.min.js" | minify | fingerprint -}}
{{- $photoSwipeCSS := resources.Get "photoswipe/photoswipe.css" | fingerprint -}}
<link href="{{ $photoSwipeCSS.RelPermalink }}" rel="stylesheet">
<script src="{{ $photoSwipe.RelPermalink }}"></script>
<script src="{{ $photoSwipeLightbox.RelPermalink }}"></script>
<script type="text/javascript">
document.addEventListener('DOMContentLoaded', function() {
  // One item per photo, in gallery order, then photos that are only inline
  const items = [];
  const position = new Map();
  const images = [
    ...document.querySelectorAll('gallery img[data-full]'),
    ...document.querySelectorAll('img[data-full]')
  ];
  images.forEach(img => {
    const src = img.dataset.full;
    if (position.has(src)) return;
    position.set(src, items.length);
    items.push({
      src: src,
      w: parseInt(img.dataset.fullW, 10),
      h: parseInt(img.dataset.fullH, 10)
    });
  });

  const lightbox = new PhotoSwipeLightbox({
    dataSource: items,
    pswpModule: PhotoSwipe,
    showHideAnimationType: 'fade',
    showAnimationDuration: 333,
    hideAnimationDuration: 333
  });

  // Add click handlers to images
  images.forEach(img => {
    img.onclick = () => lightbox.loadAndOpen(position.get(img.dataset.full));
  });

  lightbox.init();
});
</script>
